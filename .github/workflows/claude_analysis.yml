name: Monthly Claude Financial Analysis

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:
    inputs:
      month_override:
        description: 'Month to generate (YYYY_MM e.g. 2026_04). Leave blank for previous month.'
        required: false
        default: ''

jobs:
  generate-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run analysis script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
          MONTH_OVERRIDE: ${{ github.event.inputs.month_override }}
        run: python3 generate_analysis.py
